version: '3.8'

services:
  # 1. データベース
  db:
    image: mysql:8.4
    container_name: img_mysql
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./db-data:/var/lib/mysql


  # 2. Python API (解析用)
  python-api:
    build:
      context: ./backend/python
      dockerfile: ../../docker/python/Dockerfile
    container_name: img_python
    volumes:
      - ./backend/python:/app
      - ~/Desktop/my_images:/data
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db/app_db
    ports:
      - "8000:8000"


  # 3. Laravel (バックエンド)
  laravel:
    build:
      context: ./backend/php
      dockerfile: ../../docker/php/Dockerfile
    container_name: img_laravel
    volumes:
      - ./backend/php:/var/www/html
      - ~/Desktop/my_images:/data
    ports:
      - "8080:80"
    depends_on:
      - db
      - python-api

  # 4. Vue.js (フロントエンド)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
    container_name: img_vue
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
